<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — Room Rent Manager</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f9fafb;
      color: #111827;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card { max-width: 360px; }
    .icon {
      width: 56px; height: 56px; border-radius: 14px;
      background: #2563eb; margin: 0 auto 20px;
    }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { color: #6b7280; font-size: 0.95rem; margin: 0 0 20px; }
    button {
      background: #2563eb; color: white; border: none; border-radius: 8px;
      padding: 10px 20px; font-size: 0.95rem; cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon"></div>
    <h1>You're offline</h1>
    <p>Room Rent Manager needs an internet connection to load your data. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
